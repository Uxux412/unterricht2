<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1, 2 oder 3 · Deutschland nach 1945</title>
<style>
  :root{ --ink:#262626; --grey:#6e6e6e; --bg:#ffffff; --linie:#e2e2e2;
         --rot:#c00000; --gruen:#1b7f3b; --blau:#15509e;
         --rot-h:#fbe9e9; --gruen-h:#e6f4ea; --blau-h:#e7eef9; }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --ink:#f2f2f2; --grey:#a8a8a8; --bg:#141414; --linie:#333;
      --rot:#e04848; --gruen:#2f9e57; --blau:#3b78d0; --rot-h:#3a1c1c; --gruen-h:#163322; --blau-h:#17263d; } }
  :root[data-theme="dark"]{ --ink:#f2f2f2; --grey:#a8a8a8; --bg:#141414; --linie:#333;
      --rot:#e04848; --gruen:#2f9e57; --blau:#3b78d0; --rot-h:#3a1c1c; --gruen-h:#163322; --blau-h:#17263d; }
  *{box-sizing:border-box}
  html{scroll-snap-type:y mandatory; scroll-behavior:smooth}
  body{margin:0; background:var(--bg); color:var(--ink);
       font-family:"Poppins","Calibri","Segoe UI",system-ui,sans-serif}
  header.top{position:fixed; top:0; left:0; right:0; z-index:5;
       display:flex; justify-content:space-between; align-items:center; gap:12px 20px; flex-wrap:wrap;
       padding:10px 16px; background:var(--bg); border-bottom:1px solid var(--linie);
       font-size:clamp(13px,1.3vw,18px)}
  header.top a{color:var(--grey); text-decoration:none}
  .ecken{display:flex; gap:8px; flex-wrap:wrap}
  .ecken span{color:#fff; font-weight:700; border-radius:999px; padding:3px 12px}
  .ecken .c1{background:var(--rot)} .ecken .c2{background:var(--gruen)} .ecken .c3{background:var(--blau)}
  section.f{min-height:100vh; scroll-snap-align:start; display:flex; flex-direction:column;
       justify-content:center; padding:96px 16px 48px; max-width:1200px; margin:0 auto}
  .nr{color:var(--grey); font-size:clamp(14px,1.5vw,22px); margin:0 0 12px; letter-spacing:.04em}
  h2{font-size:clamp(24px,3.4vw,50px); line-height:1.22; margin:0 0 clamp(18px,3vh,40px); font-weight:700}
  ol{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:clamp(10px,1.8vh,22px)}
  li{display:flex; align-items:center; gap:clamp(14px,2vw,30px); padding:clamp(8px,1.4vh,16px) clamp(12px,1.6vw,24px);
     border-radius:16px; border-left:clamp(10px,1.2vw,18px) solid; transition:opacity .18s ease}
  .e1{background:var(--rot-h); border-color:var(--rot)}
  .e2{background:var(--gruen-h); border-color:var(--gruen)}
  .e3{background:var(--blau-h); border-color:var(--blau)}
  .z{flex:none; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700;
     width:clamp(48px,6vw,92px); height:clamp(48px,6vw,92px); border-radius:50%;
     font-size:clamp(28px,3.8vw,60px); line-height:1}
  .e1 .z{background:var(--rot)} .e2 .z{background:var(--gruen)} .e3 .z{background:var(--blau)}
  .t{font-size:clamp(20px,2.7vw,42px); line-height:1.25; flex:1}
  .haken{font-size:clamp(26px,3.2vw,52px); font-weight:700; opacity:0}
  .e1 .haken{color:var(--rot)} .e2 .haken{color:var(--gruen)} .e3 .haken{color:var(--blau)}
  .note{margin:clamp(18px,3vh,38px) 0 0; color:var(--grey); font-style:italic;
        font-size:clamp(15px,1.6vw,24px); line-height:1.4; opacity:0; transition:opacity .18s ease}
  .loesen{margin-top:clamp(16px,2.6vh,32px); align-self:flex-start; font:inherit;
        font-size:clamp(14px,1.4vw,20px); color:var(--grey); background:none;
        border:1px solid var(--linie); border-radius:999px; padding:8px 20px; cursor:pointer}
  .loesen:hover{color:var(--ink); border-color:var(--grey)}
  section.f.auf li:not(.ok){opacity:.22}
  section.f.auf .ok .t{font-weight:700}
  section.f.auf .ok .haken{opacity:1}
  section.f.auf .note{opacity:1}
  section.f.auf .loesen{visibility:hidden}
  @media print{
    html{scroll-snap-type:none}
    header.top{position:static}
    section.f{min-height:auto; page-break-after:always; padding:20px 0}
    .note,.haken{opacity:1}
    li:not(.ok){opacity:1}
    .ok .t{font-weight:700}
    .loesen{display:none}
    li,.z,.ecken span{-webkit-print-color-adjust:exact; print-color-adjust:exact}
  }
</style>
</head>
<body>
<header class="top">
  <span><a href="../../index.html">🏠 Übersicht</a> &nbsp;·&nbsp; <b>1, 2 oder 3 · Deutschland nach 1945</b></span>
  <span class="ecken"><span class="c1">1 rot</span><span class="c2">2 grün</span><span class="c3">3 blau</span></span>
</header>
<main id="quiz"></main>
<script>
  // Fragen: [Frage, [Antwort 1, 2, 3], richtige Nummer, Auflösung]
  var FRAGEN = [
    ["Ab wann galt die bedingungslose Kapitulation der Wehrmacht?",
     ["8. Mai 1945", "6. August 1945", "1. September 1945"], 1,
     "Unterzeichnet am 7. Mai in Reims, in Kraft am 8. Mai 1945 – in Berlin-Karlshorst noch einmal unterschrieben."],
    ["Wer vertrat Großbritannien zu Beginn der Potsdamer Konferenz? Und wie schreibt man ihn?",
     ["Chruchil", "Churchiel", "Churchill"], 3,
     "Winston Churchill. Er verlor mitten in der Konferenz die Wahl – ab 28. Juli saß Clement Attlee am Tisch."],
    ["In welchem Gebäude tagte die Potsdamer Konferenz?",
     ["im Reichstag in Berlin", "im Schloss Sanssouci", "im Schloss Cecilienhof"], 3,
     "Vom 17. Juli bis 2. August 1945. Truman, Stalin und Churchill/Attlee – Frankreich war nicht eingeladen."],
    ["Welcher Begriff gehört NICHT zu den Zielen der Alliierten für Deutschland?",
     ["Demilitarisierung", "Diktatur", "Dezentralisierung"], 2,
     "Die vier D: Denazifizierung, Demilitarisierung, Dezentralisierung, Demokratisierung."],
    ["Welche Linie wurde in Potsdam als vorläufige Grenze im Osten festgelegt?",
     ["die Oder-Neiße-Linie", "die Elbe-Saale-Linie", "die Weichsel-Linie"], 1,
     "Die Gebiete östlich davon kamen unter polnische bzw. sowjetische Verwaltung. Endgültig anerkannt erst 1990."],
    ["In welcher Besatzungszone lag Villingen?",
     ["in der amerikanischen", "in der französischen", "in der britischen"], 2,
     "Der Süden von Baden und Württemberg war französisch – Frankreich nahm erst ab 1949/50 Vertriebene auf."],
    ["Wie viele Flüchtlinge und Vertriebene lebten 1950 in der Bundesrepublik und der DDR zusammen?",
     ["1,25 Millionen", "12,5 Millionen", "125 Millionen"], 2,
     "Rund 12,5 Millionen – davon 7,9 Millionen im Westen. Deshalb gibt es bei uns die Breslauer und die Königsberger Straße."],
    ["Was war die Bizone?",
     ["die beiden Hälften Berlins", "die sowjetische und die französische Zone zusammen", "die amerikanische und die britische Zone zusammen"], 3,
     "Seit 1. Januar 1947 gemeinsam verwaltet – ein erster Schritt Richtung Weststaat."],
    ["Wie reagierte die Sowjetunion 1948 auf die neue D-Mark im Westen?",
     ["mit dem Mauerbau", "mit der Berlin-Blockade", "mit einem Volksaufstand"], 2,
     "Juni 1948 bis Mai 1949. Die Westalliierten versorgten West-Berlin elf Monate lang über die Luftbrücke."],
    ["Welcher deutsche Staat wurde 1949 zuerst gegründet?",
     ["die Bundesrepublik (23. Mai)", "die DDR (7. Oktober)", "beide am selben Tag"], 1,
     "Am 23. Mai 1949 trat das Grundgesetz in Kraft. Die DDR folgte am 7. Oktober – Deutschland war geteilt."]
  ];
  var html = "";
  FRAGEN.forEach(function(f, i){
    html += '<section class="f" tabindex="0"><p class="nr">Frage ' + (i + 1) + ' von ' + FRAGEN.length + '</p><h2>' + f[0] + '</h2><ol>';
    f[1].forEach(function(a, j){
      html += '<li class="e' + (j + 1) + (f[2] === j + 1 ? ' ok' : '') + '"><span class="z">' + (j + 1) +
              '</span><span class="t">' + a + '</span><span class="haken">&#10003;</span></li>';
    });
    html += '</ol><p class="note">' + f[3] + '</p><button class="loesen" type="button">Auflösen</button></section>';
  });
  document.getElementById("quiz").innerHTML = html;
  document.querySelectorAll("section.f").forEach(function(s){
    function auf(){ s.classList.add("auf"); }
    s.querySelector(".loesen").addEventListener("click", auf);
    s.addEventListener("keydown", function(ev){
      if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); auf(); }
    });
  });
</script>
</body>
</html>
