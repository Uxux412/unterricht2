:root {
  --ink: #262626; --grau: #6e6e6e; --hell: #c9c9c9; --papier: #fbfaf6; --rand: #f1ede4;
  --gruppe: #fff3b0;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: var(--rand);
  font-family: "KS1", Calibri, "Avenir Next", "Segoe UI", system-ui, sans-serif; color: var(--ink);
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
#stage { position: absolute; left: 0; top: 0; width: 1200px; height: 860px; transform-origin: 0 0;
  background: #fff; box-shadow: 0 2px 14px rgba(0,0,0,.12); touch-action: none; }

/* ---------------------------------------------------------------- Kopfleiste */
#top { position: absolute; left: 0; top: 0; width: 1200px; height: 74px; display: flex; align-items: center;
  padding: 6px 16px 4px 10px; gap: 14px; }
#titel { height: 62px; width: auto; flex: none; }
#gruppe { flex: 1; min-width: 0; line-height: 1.2; }
#gruppe .zeile1 { font-size: 17px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#gruppe .zeile2 { font-size: 13.5px; color: var(--grau); white-space: nowrap; }
.swatch { display: inline-block; width: 15px; height: 15px; border: 1.5px solid var(--ink); border-radius: 50%;
  vertical-align: -2px; margin-right: 6px; background: var(--gruppe); }
#uhr { flex: none; text-align: right; line-height: 1.05; font-variant-numeric: tabular-nums; }
#datum { font-size: 15px; color: var(--ink); }
#zeit { font-size: 30px; font-weight: 700; letter-spacing: .5px; }
#logo { height: 30px; flex: none; margin-left: 4px; }

/* ---------------------------------------------------------------- Legefläche */
#board { position: absolute; left: 0; top: 74px; width: 1200px; height: 736px; background-color: var(--papier);
  background-image: radial-gradient(#dcd7cb 1px, transparent 1.2px); background-size: 24px 24px; overflow: hidden; }
.card { position: absolute; background: var(--gruppe); color: var(--ink); border: 2px dashed var(--ink);
  border-radius: 3px; padding: 6px 9px; display: flex; flex-direction: column; justify-content: center;
  box-shadow: 0 1px 3px rgba(0,0,0,.18); touch-action: none; cursor: grab; transition: box-shadow .12s; }
.card.zieht { box-shadow: 0 8px 22px rgba(0,0,0,.28); cursor: grabbing; }
.card.sit { border: 4px double var(--ink); }
.card.pot { border: 2.6px dotted var(--ink); }
.card.pol { border: 2px dashed var(--ink); }
.card .t { font-size: 14.5px; font-weight: 700; line-height: 1.12; }
.card.label { padding: 4px 6px; }
.card.label .t { text-align: center; }
.card.kopf { justify-content: center; }
.card.kopf .t { font-size: 15.5px; text-align: center; text-transform: none; }
.card.kat .t { font-size: 15px; text-align: center; letter-spacing: .3px; }
.card.kopf, .card.kat { background: #fff; }
.card.kopf::after, .card.kat::after { content: ""; position: absolute; inset: 3px; background: var(--gruppe); opacity: .55; z-index: -1; }
.card .bu { position: absolute; left: -10px; top: -10px; width: 22px; height: 22px; border-radius: 50%;
  background: #fff; border: 1.6px solid var(--ink); font-size: 12.5px; font-weight: 700; line-height: 19px;
  text-align: center; }
.card .lesen { position: absolute; right: 5px; bottom: 3px; font-size: 11px; color: var(--grau); }
.card.text .t { padding-right: 18px; }
.card.d { justify-content: flex-start; }
.card.d .t { font-size: 15px; margin-bottom: 3px; }
.card.d .inhalt { font-size: 12.5px; line-height: 1.18; font-weight: 400; overflow: hidden; }
.card.d .inhalt.leer { color: var(--grau); font-style: italic; }
.pfeil { position: absolute; width: 70px; height: 30px; touch-action: none; cursor: grab; }
.pfeil svg { width: 100%; height: 100%; overflow: visible; display: block; }
#ablage { position: absolute; right: 14px; bottom: 8px; font-size: 12px; color: var(--grau); }

/* ---------------------------------------------------------------- Fußleiste */
#fuss { position: absolute; left: 0; top: 810px; width: 1200px; height: 50px; display: flex; align-items: center;
  gap: 10px; padding: 0 14px; }
.knopf { font: inherit; font-size: 16px; font-weight: 700; color: var(--ink); background: #fff; border: 1.8px solid var(--ink);
  border-radius: 22px; padding: 6px 16px; touch-action: manipulation; cursor: pointer; }
.knopf.haupt { background: var(--ink); color: #fff; }
.knopf:active { transform: translateY(1px); }
#fuss .info { margin-left: auto; font-size: 13px; color: var(--grau); }

/* ---------------------------------------------------------------- Dialoge */
#dlg { position: absolute; inset: 0; background: rgba(38,38,38,.38); display: none; align-items: flex-start;
  justify-content: center; padding-top: 70px; z-index: 99999; }
#dlg.offen { display: flex; }
#dlg .box { width: 640px; max-width: 92%; background: #fff; border-radius: 10px; padding: 22px 26px 20px;
  box-shadow: 0 10px 40px rgba(0,0,0,.3); }
#dlg h2 { margin: 0 0 10px; font-size: 24px; }
#dlg p { font-size: 18px; line-height: 1.38; margin: 0 0 12px; }
#dlg ol { font-size: 17px; line-height: 1.4; margin: 0 0 12px; padding-left: 22px; }
#dlg .text { font-size: 19px; line-height: 1.42; user-select: text; -webkit-user-select: text; }
#dlg input, #dlg textarea { font: inherit; font-size: 19px; width: 100%; border: 1.8px solid var(--ink);
  border-radius: 6px; padding: 9px 11px; color: var(--ink); user-select: text; -webkit-user-select: text; }
#dlg textarea { height: 150px; resize: none; line-height: 1.35; }
#dlg .reihe { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; flex-wrap: wrap; }
.farben { display: flex; gap: 10px; flex-wrap: wrap; margin: 12px 0 14px; }
.farbe { width: 58px; height: 46px; border-radius: 8px; border: 2px solid #999; font-size: 12px; font-weight: 700;
  display: flex; align-items: flex-end; justify-content: center; padding-bottom: 3px; cursor: pointer; color: var(--ink); }
.farbe.an { border: 3.5px solid var(--ink); }
.hinweis { font-size: 15px; color: var(--grau); }
#toast { position: absolute; left: 50%; top: 360px; transform: translateX(-50%); background: var(--ink); color: #fff;
  font-size: 22px; font-weight: 700; padding: 14px 24px; border-radius: 12px; display: none; z-index: 100000;
  text-align: center; line-height: 1.3; }

#quer { display: none; position: fixed; top: 14px; left: 0; right: 0; text-align: center; font-size: 17px; color: var(--grau); }
@media screen and (orientation: portrait) { #quer { display: block; } }

/* ---------------------------------------------------------------- Druck: Notfall-Kartensatz */
#druck { display: none; }
@media print {
  @page { size: A4; margin: 12mm; }
  html, body { overflow: visible; height: auto; background: #fff; }
  #stage, #quer { display: none !important; }
  #druck { display: block; font-family: "KS1", Calibri, sans-serif; color: #000; }
  #druck h1 { font-size: 15pt; margin: 0 0 2mm; }
  #druck .sub { font-size: 9.5pt; color: #555; margin: 0 0 4mm; }
  #druck .gitter { display: grid; grid-template-columns: 1fr 1fr 1fr; border-top: 1px dashed #999; border-left: 1px dashed #999; }
  #druck .k { border-right: 1px dashed #999; border-bottom: 1px dashed #999; padding: 4mm 4mm 3.5mm; min-height: 30mm;
    break-inside: avoid; position: relative; }
  #druck .k .rahmen { position: absolute; inset: 2mm; pointer-events: none; }
  #druck .k.sit .rahmen { border: 3px double #000; }
  #druck .k.pot .rahmen { border: 2px dotted #000; }
  #druck .k.pol .rahmen { border: 1.5px dashed #000; }
  #druck .k .t { font-weight: 700; font-size: 11pt; margin: 1mm 2mm 1mm; }
  #druck .k .x { font-size: 9pt; line-height: 1.3; margin: 0 2mm; }
  #druck .k .b { position: absolute; right: 4mm; top: 3mm; font-size: 9pt; font-weight: 700; }
}
</style>
</head>

: ["pot", "", ""], "text": "Für Deutschland als Ganzes war der Alliierte Kontrollrat in Berlin zuständig. Dort saßen die vier Oberbefehlshaber; Beschlüsse mussten einstimmig fallen. Gemeinsam hoben die Alliierten die NS-Gesetze auf und lösten die NSDAP auf. Im Nürnberger Prozess 1945/46 verurteilten sie die Hauptkriegsverbrecher (12 Todesurteile). Doch Frankreich blockierte eine deutsche Zentralverwaltung, und die Siegermächte stritten immer mehr. Im März 1948 verließ der sowjetische Vertreter den Kontrollrat."}, {"id": "w0", "typ": "pol", "art": "kopf", "titel": "Westliche Besatzungszonen", "loes": ["pol", "west", ""]}, {"id": "o0", "typ": "pol", "art": "kopf", "titel": "Sowjetische Besatzungszone (SBZ)", "loes": ["pol", "ost", ""]}, {"id": "k1", "typ": "pol", "art": "kat", "titel": "Ziele", "loes": ["pol", "kat", "ziele"]}, {"id": "k2", "typ": "pol", "art": "kat", "titel": "Politik", "loes": ["pol", "kat", "politik"]}, {"id": "k3", "typ": "pol", "art": "kat", "titel": "Wirtschaft", "loes": ["pol", "kat", "wirtschaft"]}, {"id": "k4", "typ": "pol", "art": "kat", "titel": "Staatsgründung", "loes": ["pol", "kat", "staat"]}, {"id": "w1", "typ": "pol", "art": "text", "bu": "G", "titel": "Kurswechsel nach Westen", "loes": ["pol", "west", "ziele"], "text": "Die Westmächte wollten Deutschland zunächst entmachten und streng kontrollieren. Mit dem beginnenden Kalten Krieg änderten sie ab 1946/47 ihren Kurs: Ihre Zonen sollten wieder auf die Beine kommen – als Demokratie nach westlichem Vorbild mit freien Wahlen und Marktwirtschaft, fest an den Westen gebunden."}, {"id": "w2", "typ": "pol", "art": "text", "bu": "A", "titel": "Demokratie „von unten“", "loes": ["pol", "west", "politik"], "text": "In den Westzonen entstand die Demokratie „von unten“: zuerst Gemeindeverwaltungen, 1946 die ersten freien Gemeindewahlen, dann Länder mit eigenen Parlamenten und Verfassungen (1945–1947). Parteien wie SPD, KPD, CDU/CSU und Liberale wurden zugelassen. Zur Entnazifizierung füllten Millionen Deutsche Fragebögen aus; Spruchkammern stuften sie ein – die meisten als „Mitläufer“."}, {"id": "w3", "typ": "pol", "art": "text", "bu": "O", "titel": "Bizone, Marshallplan, D-Mark", "loes": ["pol", "west", "wirtschaft"], "text": "Zum 1. Januar 1947 – mitten im Hungerwinter – legten die USA und Großbritannien ihre Zonen zur Bizone zusammen; 1949 kam die französische Zone hinzu (Trizone). Ab 1948 half Geld aus dem Marshallplan beim Wiederaufbau. Am 20. Juni 1948 kam in den Westzonen die D-Mark, dazu die Marktwirtschaft. Die Sowjetunion antwortete mit der Blockade West-Berlins; die Westmächte versorgten die Stadt fast ein Jahr lang über eine Luftbrücke."}, {"id": "w4", "typ": "pol", "art": "text", "bu": "D", "titel": "Parlamentarischer Rat", "loes": ["pol", "west", "staat"], "text": "Am 1. Juli 1948 beauftragten die Westmächte die Ministerpräsidenten der Länder, eine Verfassung ausarbeiten zu lassen. Ab September 1948 beriet der Parlamentarische Rat in Bonn darüber. Am 23. Mai 1949 wurde das Grundgesetz verkündet: Die Bundesrepublik Deutschland war gegründet. Im August 1949 wählten die Westdeutschen den ersten Bundestag."}, {"id": "o1", "typ": "pol", "art": "text", "bu": "N", "titel": "Nie wieder Gefahr aus Deutschland", "loes": ["pol", "ost", "ziele"], "text": "Die Sowjetunion hatte im Krieg die meisten Opfer zu beklagen. Sie wollte, dass von Deutschland nie wieder eine Gefahr ausgeht, und verlangte hohe Reparationen. In ihrer Zone ließ sie ein kommunistisch geprägtes System aufbauen – nach ihrem Willen das Modell für ein künftiges Gesamtdeutschland."}, {"id": "o2", "typ": "pol", "art": "text", "bu": "J", "titel": "Block und SED", "loes": ["pol", "ost", "politik"], "text": "Noch während der Kämpfe um Berlin kehrten deutsche Kommunisten aus Moskau zurück (Gruppe Ulbricht). Neben KPD und SPD entstanden CDU und LDP, doch alle Parteien mussten in einem „Block“ unter Führung der KPD zusammenarbeiten. Im April 1946 wurden KPD und SPD zur SED zwangsvereinigt. Die Entnazifizierung war streng, traf aber auch politische Gegner: Viele kamen in sowjetische Speziallager."}, {"id": "o3", "typ": "pol", "art": "text", "bu": "Q", "titel": "Bodenreform und Demontage", "loes": ["pol", "ost", "wirtschaft"], "text": "Bei der Bodenreform 1945 wurden Großgrundbesitzer mit mehr als 100 Hektar entschädigungslos enteignet; ihr Land bekamen Kleinbauern, Landarbeiter und Vertriebene. Banken und große Betriebe wurden verstaatlicht, viele Fabriken als Reparationen abgebaut und in die Sowjetunion gebracht. Die Wirtschaft wurde nach Plänen gelenkt. Hilfe aus dem Marshallplan durfte die SBZ nicht annehmen."}, {"id": "o4", "typ": "pol", "art": "text", "bu": "I", "titel": "Volkskongress und Verfassung", "loes": ["pol", "ost", "staat"], "text": "Ab Ende 1947 lenkte die SED die „Volkskongressbewegung“. Ein vom Volkskongress gewählter Volksrat arbeitete eine Verfassung aus, die sich an die Weimarer Verfassung anlehnte. Im Mai 1949 wurde der 3. Volkskongress gewählt – nur mit Ja oder Nein zu einer Einheitsliste. Am 7. Oktober 1949 trat die Verfassung in Kraft: Die Deutsche Demokratische Republik (DDR) war gegründet."}], "pfeile": 6, "tipps": ["Es gibt drei Rahmen: doppelt = Situation nach dem 8. Mai 1945 · gepunktet = Potsdamer Konferenz und gemeinsame Politik der Alliierten · gestrichelt = Politik in den Besatzungszonen.", "Für die Westzonen und für die SBZ gibt es je vier Karten. Sie passen zu den Kategorien Ziele, Politik, Wirtschaft und Staatsgründung.", "Legt von oben nach unten: erst die Lage 1945, dann Potsdam und den Kontrollrat, darunter West und Ost nebeneinander."]};

  // ------------------------------------------------------------ Uhr

  function baueKarte(k) {

  function mische(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

    document.getElementById("namen").textContent = state.namen ? "Gruppe: " + state.namen : "Gruppe noch ohne Namen";
  }

  // ------------------------------------------------------------ Druckansicht (Notfall-Kartensatz)
  function baueDruck() {
    var d = document.getElementById("druck");
    var h = '<h1>Notfall-Kartensatz: Besatzungspolitik 1945–1949</h1><p class="sub">GGK | J2 | DEC · ' +
            'Nur nutzen, wenn das Board nicht lädt: ausschneiden, legen, fotografieren.</p><div class="gitter">';
    var liste = DATA.karten.slice().sort(function (a, b) {      // Reihenfolge verrät nichts: erst Überschriften, dann nach Kennbuchstabe
      var x = a.bu || " " + a.titel, y = b.bu || " " + b.titel; return x < y ? -1 : x > y ? 1 : 0; });
    liste.forEach(function (k) {
      h += '<div class="k ' + k.typ + '"><div class="rahmen"></div>' + (k.bu ? '<span class="b">' + k.bu + '</span>' : '') +
           '<div class="t">' + esc(k.titel) + '</div>' + (k.text ? '<div class="x">' + esc(k.text) + '</div>' : '') +
           (k.art === "d" ? '<div class="x" style="color:#777">Ergebnis aus Aufgabe 2:</div>' : '') + '</div>';
    });
    d.innerHTML = h + "</div>";
  }

  // ------------------------------------------------------------ Start
  state = lade();
  var gueltig = state && state.pos && DATA.karten.every(function (k) { return state.pos[k.id]; });
  if (!gueltig) state = neuerZustand();
  state.d = state.d || {};
  DATA.karten.forEach(function (k) { els[k.id] = baueKarte(k); });
  for (var i = 0; i < DATA.pfeile; i++) { els["a" + i] = bauePfeil(i); if (!state.pos["a" + i]) state.pos["a" + i] = startPositionen()["a" + i]; }
  Object.keys(els).forEach(function (id) {
    topZ = Math.max(topZ, state.pos[id][3] || 1);
    setze(id);
    els[id].addEventListener("pointerdown", down);
    els[id].addEventListener("pointermove", move);
    els[id].addEventListener("pointerup", up);
    els[id].addEventListener("pointercancel", up);
  });
  DATA.karten.forEach(function (k) { if (k.art === "d") zeichneD(k.id); });
  if (state.tipp) document.getElementById("bTipp").textContent = "Tipp (" + state.tipp + "/" + DATA.tipps.length + ")";
  document.getElementById("bHilfe").onclick = zeigeHilfe;
  document.getElementById("bTipp").onclick = zeigeTipp;
  document.getElementById("bNeu").onclick = zeigeNeu;
  document.getElementById("bFertig").onclick = function () {
    toast("Jetzt Screenshot machen!<br><span style='font-size:17px;font-weight:400'>obere Taste + Lauter-Taste · Uhr und Namen sichtbar?</span>");
  };
  wendeAn(); passe(); tick(); baueDruck(); passeAlle();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(passeAlle);
  if (!state.namen) zeigeStart();
})();
</script>
